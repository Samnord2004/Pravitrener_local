name: Build & Release Desktop Installers (macOS M1+ .dmg & Windows .exe)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional Release Tag (defaults to v<package.json version>)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: macOS Apple Silicon (M1–M4 .dmg)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root & desktop dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix desktop install --no-audit --no-fund

      - name: Build bundle & package Apple Silicon .dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:mac

      - name: Upload macOS arm64 artifacts (.dmg & .zip)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            release-desktop/*.dmg
            release-desktop/*.zip
            release-desktop/*.blockmap
          if-no-files-found: error

  build-windows-x64:
    name: Windows x64 (.exe NSIS + Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root & desktop dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix desktop install --no-audit --no-fund

      - name: Build bundle & package Windows .exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:win

      - name: Upload Windows x64 artifacts (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            release-desktop/*.exe
            release-desktop/*.blockmap
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release (.dmg & .exe)
    needs: [build-macos-arm64, build-windows-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: release-artifacts

      - name: Download Windows x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64
          path: release-artifacts

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release with .dmg and .exe installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "ЭТАЛОН ПРАВИЛО ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/*.exe
            release-artifacts/*.blockmap
