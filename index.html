  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="ЭТАЛОН ПРАВИЛО · Студия" />
    <meta property="og:description" content="Платформа управления студиями ПравИло, телеметрия тренировок и Android-приложения для администратора, тренера и клиента." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ЭТАЛОН ПРАВИЛО" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/assets/aistudio/logo_f7cf1eaa.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@600;700&family=Exo+2:wght@600;700;800&family=Fira+Code:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=PT+Mono&family=PT+Sans:wght@400;700&family=Playfair+Display:wght@600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="st-canvas antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script>
      (function () {
        try {
          var app = new URLSearchParams(window.location.search).get('app');
          if (app === 'admin' || app === 'trainer' || app === 'client') {
            var map = {
              admin: { title: 'ЭТАЛОН ПРАВИЛО — Администратор', manifest: '/manifest-admin.webmanifest', icon: '/android-admin-192.png' },
              trainer: { title: 'ЭТАЛОН ПРАВИЛО — Тренер', manifest: '/manifest-trainer.webmanifest', icon: '/android-trainer-192.png' },
              client: { title: 'ЭТАЛОН ПРАВИЛО — Клиент', manifest: '/manifest-client.webmanifest', icon: '/android-client-192.png' }
            }[app];
            document.title = map.title;
            var ml = document.querySelector('link[rel="manifest"]');
            if (ml) { ml.setAttribute('href', map.manifest); }
            else {
              var nl = document.createElement('link');
              nl.rel = 'manifest';
              nl.href = map.manifest;
              document.head.appendChild(nl);
            }
            var iconEl = document.querySelector('link[rel="icon"]');
            if (iconEl) iconEl.setAttribute('href', map.icon);
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
